name: Profile 3D contributions

# Redraws the 3D contribution graph in the profile README every day
# (00:00 Vietnam time) and whenever the colours or this workflow change.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/profile-3d-settings.json"
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git push
          fi
